name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Extract and Build
      run: |
        if [ -f "shop_assistant_full_v0_1.zip" ]; then
          echo "Extracting ZIP..."
          unzip -q shop_assistant_full_v0_1.zip -d project_extracted
        fi
        
        PUBSPEC_PATH=$(find project_extracted -name "pubspec.yaml" | head -n 1)
        if [ -n "$PUBSPEC_PATH" ]; then
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          cd "$PROJECT_DIR"
          echo "Found Flutter project at: $(pwd)"
          
          # حذف مجلد الأندرويد القديم لتجنب تعارض الإصدارات وتوليد هيكلية جديدة متوافقة
          rm -rf android
          
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --debug
        else
          echo "ERROR: pubspec.yaml not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/app/outputs/flutter-apk/app-debug.apk'
