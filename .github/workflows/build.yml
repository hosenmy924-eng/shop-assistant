name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project and Build
      run: |
        echo "=== Listing Root Directory ==="
        ls -la
        
        if [ -f "shop_assistant_full_v0_1.zip" ]; then
          echo "Found ZIP file, extracting..."
          unzip -q shop_assistant_full_v0_1.zip -d project_extracted
        else
          echo "ZIP file not found in root, searching..."
          ZIP_FILE=$(find . -name "shop_assistant_full_v0_1.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d project_extracted
          fi
        fi
        
        # البحث عن مجلد المشروع أو ملف gradlew
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "ERROR: Gradle wrapper not found anywhere!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
        
