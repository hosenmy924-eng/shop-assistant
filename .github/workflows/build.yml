name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and Build Project
      run: |
        if [ -f "shop_assistant_full_v0_1.zip" ]; then
          echo "Extracting ZIP..."
          unzip -q shop_assistant_full_v0_1.zip -d project_extracted
        fi
        
        echo "Searching for build.gradle..."
        BUILD_GRADLE=$(find project_extracted -name "build.gradle" | head -n 1)
        
        if [ -n "$BUILD_GRADLE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          cd "$PROJECT_DIR"
          echo "Found project directory at: $PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "ERROR: build.gradle not found anywhere in the extracted files!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
        
